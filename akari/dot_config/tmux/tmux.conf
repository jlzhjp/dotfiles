set -g base-index 1
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mode-keys vi
set -g mouse on
set -g prefix C-a
set -g default-terminal tmux-256color

# Plugins are managed by TPM when it is installed.
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @tmux-dotbar-bg "#0b0e14"
set -g @tmux-dotbar-fg "#475266"
set -g @tmux-dotbar-fg-current "#bfbdb6"
set -g @tmux-dotbar-fg-session "#565b66"
set -g @tmux-dotbar-fg-prefix "#95e6cb"
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-status-right " Continuum: #{continuum_status} %H:%M "
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

set -g renumber-windows on
set -g set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ",xterm-256color:RGB"

bind T break-pane
bind o kill-pane -a
bind n split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind q kill-pane
bind x swap-pane -D
bind m select-pane -m
bind r rotate-window -D
bind R rotate-window -U
bind C-a select-pane -t "{next}"
bind C-w select-pane -t "{next}"
bind w select-pane -t "{next}"
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind p last-pane
bind = select-layout -E
bind u select-layout -o
bind C-r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind -n M-h previous-window
bind -n M-l next-window
bind Tab last-window

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# TPM is optional until the plugin bootstrap step is added.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
